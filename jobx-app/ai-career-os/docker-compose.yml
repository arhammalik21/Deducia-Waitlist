services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobx-db
    restart: unless-stopped
    ports:
      # 5433 avoids clashing with a local Postgres already on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: ai_career_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d ai_career_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
